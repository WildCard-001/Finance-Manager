<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Manager</title>
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2f6fed;--accs:#e8effd;--pos:#13855b;--poss:#e3f5ec;--neg:#c2410c;--negs:#fdece3;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--mute:#9aa1ad;--line:#2a2e37;--acc:#6d9bff;--accs:#1d2840;--pos:#4fd39b;--poss:#15302a;--neg:#ff9a6b;--negs:#3a2219}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#root{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;gap:10px}
header h1{font-size:19px;margin:0;letter-spacing:-.01em}
#status{font-size:12px;color:var(--mute);background:none;border:0;font-family:inherit;cursor:pointer;padding:4px 0;text-align:right}
#status.warn{color:var(--neg)}#status.ok{color:var(--pos)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 2px 8px;font-weight:600}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px 12px}
.title h3{margin:0;font-size:22px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .l{font-size:12px;color:var(--mute)}.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;text-align:left}
.row:first-child{border-top:0}.row:hover{background:var(--bg)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accs);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.av.sq{border-radius:10px}
.grow{flex:1;min-width:0}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.s{font-size:13px;color:var(--mute)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.empty{padding:22px 14px;text-align:center;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.full{width:100%}.btn.danger{color:var(--neg)}
.btn.sm{padding:7px 11px;font-size:13px}.btn.xl{color:#127a3e}
.btn[disabled]{opacity:.55;pointer-events:none}
@media (prefers-color-scheme:dark){.btn.xl{color:#5fd08f}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 2px 5px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 12px;font:inherit;font-size:16px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.ghost{border-style:dashed;color:var(--mute)}.chip.add{border-style:dashed;color:var(--acc)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;font-size:13px;padding:7px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.prow:first-child{border-top:0}
.prow input{width:110px;padding:8px 10px;text-align:right}
.msg{font-size:13px;margin-top:8px}
.hero{text-align:center;padding:22px 14px}.hero .v{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav a{flex:1;text-align:center;padding:10px 0 12px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600}
nav a .i{display:block;font-size:19px;line-height:1.2}nav a.on{color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .card{width:100%;max-width:400px}
.modal h3{margin:0 0 8px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:11;max-width:90vw;text-align:center}
.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;padding:0;cursor:pointer}
.note{font-size:13px;color:var(--mute);margin:8px 2px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--acc);background:var(--accs);border-radius:6px;padding:1px 6px;margin-right:4px}
.linkbtn{background:none;border:0;color:var(--acc);font:inherit;font-size:13px;padding:0;cursor:pointer}
</style></head><body><div id="root"></div>
<script>
(function(){
"use strict";

/* ---------- local storage ---------- */
var LSK='fm-state-v1';
function blank(){return{v:2,currency:'Rs',cfgU:0,friends:[],trackers:[],txns:[],dead:{},updatedAt:0};}
function uid(){return Math.random().toString(36).slice(2,9).replace(/[^a-z0-9]/g,'x');}
function migrate(d){
  if(!d||!d.v)return blank();
  if(!Array.isArray(d.trackers))d.trackers=[];
  if(!Array.isArray(d.friends))d.friends=[];
  if(!Array.isArray(d.txns))d.txns=[];
  if(!d.dead||typeof d.dead!=='object')d.dead={};
  if(d.currency==null)d.currency='Rs';
  var loose=d.txns.filter(function(t){return !t.tracker;});
  if(loose.length){var g={id:uid(),name:'General',ts:Date.now(),archived:false};d.trackers.push(g);loose.forEach(function(t){t.tracker=g.id;});}
  d.v=2;return d;
}
function lsGet(){try{return JSON.parse(localStorage.getItem(LSK)||'null');}catch(e){return null;}}
var S=migrate(lsGet());
/* derived data (balances, indexes, sorted lists) is cached until the data changes */
var memo={},shCache=new WeakMap();
function bump(){memo={};shCache=new WeakMap();}
function cached(k,fn){return k in memo?memo[k]:(memo[k]=fn());}
function lsWrite(){bump();try{localStorage.setItem(LSK,JSON.stringify(S));}catch(e){toast('Phone storage is full — couldn’t save.');}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

/* ---------- change tracking: every record carries u = last edit time ---------- */
/* keys: f_<id> friend, t_<id> tracker, x_<id> transaction, c_cfg settings */
function recMap(){var m={};
  S.friends.forEach(function(f){m['f_'+f.id]=f;});
  S.trackers.forEach(function(t){m['t_'+t.id]=t;});
  S.txns.forEach(function(x){m['x_'+x.id]=x;});
  m.c_cfg={currency:S.currency,u:S.cfgU};return m;}
function bare(r){var o={};for(var k in r)if(k!=='u')o[k]=r[k];return JSON.stringify(o);}
function getU(k,r){return k==='c_cfg'?(S.cfgU||0):(r.u||0);}
function setU(k,r,u){if(k==='c_cfg')S.cfgU=u;else r.u=u;}
var prev={};
function snap(){prev={};var m=recMap();for(var k in m)prev[k]={j:bare(m[k]),u:m[k].u};}
function stamp(){
  var m=recMap(),now=Date.now(),next={};
  for(var k in m){var r=m[k],j=bare(r),p=prev[k],u;
    if(p&&p.j===j)u=(p.u!=null?p.u:(r.u!=null?r.u:now));
    else u=Math.max(now,p&&p.u?p.u+1:0);
    setU(k,r,u);if(S.dead[k])delete S.dead[k];next[k]={j:j,u:u};}
  for(var k2 in prev)if(!m[k2]&&k2!=='c_cfg')S.dead[k2]=Math.max(now,(prev[k2].u||0)+1);
  prev=next;
}
function lsSet(){stamp();lsWrite();}
snap();lsSet();

/* ---------- manual sync: send a sync file / text, merge what the other device sent ---------- */
var METAK='fm-sync-meta';
function jget(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var meta=jget(METAK)||{lastIn:0,lastOut:0};if(!meta.base)meta.base={};
function saveMeta(){jset(METAK,meta);}
/* edits made since you last sent your data */
/* base = version of each item both devices are known to have (after a send or receive) */
function curVersions(){var v={},m=recMap();for(var k in m){var u=getU(k,m[k]);if(u)v[k]=u;}for(var k2 in S.dead)v[k2]=-S.dead[k2];return v;}
function unsent(){return cached('unsent',function(){var v=curVersions(),n=0;for(var k in v)if(meta.base[k]!==v[k])n++;return n;});}
function markSent(){meta.base=curVersions();delete memo.unsent;meta.lastOut=Date.now();saveMeta();refreshStatus();}
function payload(){return JSON.stringify({fmSync:1,at:Date.now(),data:S});}
/* last writer wins, per record */
function applyRemote(k,data,u,x){
  var kind=k.charAt(0),id=k.slice(2),m=recMap(),loc=m[k];
  var lu=loc?getU(k,loc):(S.dead[k]||0);
  if(u<=lu)return '';
  var arr=kind==='f'?S.friends:kind==='t'?S.trackers:kind==='x'?S.txns:null;
  if(kind==='c'){if(x)return '';S.currency=data.currency==null?'Rs':data.currency;S.cfgU=u;return 'updated';}
  if(!arr)return '';
  var i=-1;for(var n=0;n<arr.length;n++)if(arr[n].id===id){i=n;break;}
  if(x){S.dead[k]=u;if(i>=0){arr.splice(i,1);return 'deleted';}return '';}
  data.id=id;data.u=u;delete S.dead[k];
  if(i>=0){arr[i]=data;return 'updated';}arr.push(data);return 'added';
}
function mergeIn(txt){
  var o=null;try{o=JSON.parse(String(txt).trim());}catch(e){}
  var d=o&&o.fmSync?o.data:o;
  if(!d||!d.v||!Array.isArray(d.friends)||!Array.isArray(d.txns))return null;
  d=migrate(JSON.parse(JSON.stringify(d)));
  var c={added:0,updated:0,deleted:0},tally=function(r){if(r)c[r]++;};
  var inc={};
  d.friends.forEach(function(f){inc['f_'+f.id]=f;});d.trackers.forEach(function(t){inc['t_'+t.id]=t;});d.txns.forEach(function(x){inc['x_'+x.id]=x;});
  /* trackers and friends first, so transactions never point at something missing */
  Object.keys(inc).sort(function(p,q){return (p[0]==='x')-(q[0]==='x');}).forEach(function(k){var r=inc[k];tally(applyRemote(k,JSON.parse(bare(r)),r.u||1,false));});
  if(d.cfgU)applyRemote('c_cfg',{currency:d.currency},d.cfgU,false);
  for(var k in d.dead)tally(applyRemote(k,null,d.dead[k],true));
  /* an expense added to a tracker the other device deleted: keep it, in a recovered tracker */
  bump();
  S.txns.forEach(function(t){if(!tracker(t.tracker)){S.trackers.push({id:t.tracker,name:'Recovered',ts:Date.now(),archived:false});c.added++;}});
  snap();lsSet();
  /* items that now match what the other device sent are in sync */
  var v=curVersions();Object.keys(inc).forEach(function(k){if(v[k]===(inc[k].u||1))meta.base[k]=v[k];});
  for(var kd in d.dead)if(v[kd]===-d.dead[kd])meta.base[kd]=v[kd];
  if(d.cfgU&&v.c_cfg===d.cfgU)meta.base.c_cfg=v.c_cfg;
  meta.lastIn=Date.now();saveMeta();delete memo.unsent;
  return c;
}
function sendFile(){
  var t=new Date(),pad=function(n){return String(n).padStart(2,'0');};
  var name='Finance sync '+today()+' '+pad(t.getHours())+pad(t.getMinutes())+'.json';
  var blob=new Blob([payload()],{type:'application/json'});
  return saveFile(name,blob,'application/json').then(function(ok){if(ok!==false)markSent();});
}
function sendText(){copy(payload(),'Sync text copied — paste it into the app on your other device');markSent();}
function mergeReport(c){
  if(!c){toast('That isn’t a Finance Manager sync file or text.');return;}
  var n=c.added+c.updated+c.deleted;
  toast(n?'Synced: '+[c.added?c.added+' new':'',c.updated?c.updated+' updated':'',c.deleted?c.deleted+' deleted':''].filter(Boolean).join(', '):'Already up to date — nothing new');
  enter();render();
}
function ago(t){if(!t)return 'never';var s=Math.round((Date.now()-t)/1000);if(s<60)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function statusInfo(){var n=unsent();
  if(n&&(meta.lastOut||meta.lastIn))return[n+' change'+(n===1?'':'s')+' not sent','warn'];
  return['Saved on this device',''];}
function refreshStatus(){var el=document.getElementById('status');if(el){var i=statusInfo();el.textContent=i[0];el.className=i[1];}}
function commit(){S.updatedAt=Date.now();lsSet();refreshStatus();}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toC(v){var n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?Math.round(n*100):NaN;}
var NF2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),NF0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
function num(c){c=Math.abs(c);return (c%100?NF2:NF0).format(c/100);}
function fmt(c){return (S.currency?S.currency+' ':'')+num(c);}
function cStr(c){return c%100?(c/100).toFixed(2):String(c/100);}
var DF=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'}),DFY=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}),dfC={};
function dfmt(d){var r=dfC[d];if(r)return r;var x=new Date(d+'T12:00');return dfC[d]=(x.getFullYear()!==new Date().getFullYear()?DFY:DF).format(x);}
function index(k,arr){return cached(k,function(){var o={};for(var i=0;i<arr.length;i++)o[arr[i].id]=arr[i];return o;});}
function friend(id){return index('iF',S.friends)[id]||null;}
function tracker(id){return index('iT',S.trackers)[id]||null;}
function nameOf(id){if(id==='me')return 'You';var f=friend(id);return f?f.name:'(removed)';}
function initial(n){return esc((n||'?').trim().charAt(0).toUpperCase());}
function txById(id){return index('iX',S.txns)[id];}

/* ---------- money logic (everyone settles with you) ---------- */
function shares(t){
  var c=shCache.get(t);if(c)return c;c=calcShares(t);shCache.set(t,c);return c;}
function calcShares(t){
  var ids=Object.keys(t.split.parts),out={},total=t.amount;
  if(t.split.mode==='amounts'){ids.forEach(function(i){out[i]=t.split.parts[i];});return out;}
  var w=ids.map(function(i){return t.split.mode==='equal'?1:(Number(t.split.parts[i])||0);});
  var W=w.reduce(function(a,b){return a+b;},0);if(!W)return out;
  var raw=w.map(function(x){return total*x/W;}),fl=raw.map(Math.floor);
  var rem=total-fl.reduce(function(a,b){return a+b;},0);
  var ord=raw.map(function(r,k){return[r-fl[k],k];}).sort(function(a,b){return b[0]-a[0]||a[1]-b[1];});
  for(var j=0;j<rem;j++)fl[ord[j%ord.length][1]]++;
  ids.forEach(function(i,k){out[i]=fl[k];});return out;
}
function rawEffect(t,fid){var e=shares(t)[fid]||0;if(t.payer===fid)e-=t.amount;return e;}
function effect(t,fid){
  if(t.type==='payment')return t.friend===fid?(t.dir==='in'?-t.amount:t.amount):0;
  if(t.settled&&t.settled[fid])return 0;
  return rawEffect(t,fid);
}
function debtors(t){var out=[];var ids=Object.keys(t.split.parts);if(t.payer!=='me'&&ids.indexOf(t.payer)<0)ids.push(t.payer);
  ids.forEach(function(id){if(id==='me')return;var e=rawEffect(t,id);if(e)out.push({id:id,e:e,paid:!!(t.settled&&t.settled[id])});});return out;}
function involves(t,fid){return t.type==='payment'?t.friend===fid:(t.payer===fid||fid in t.split.parts);}
/* transactions of one tracker (or all); read-only — never mutate the returned array */
function txIn(tid){if(!tid)return S.txns;
  return (cached('byT',function(){var o={};S.txns.forEach(function(t){(o[t.tracker]||(o[t.tracker]=[])).push(t);});return o;})[tid])||[];}
function chronRaw(tid){return cached('c'+tid,function(){return txIn(tid).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0);});});}
function chron(tid){return chronRaw(tid).slice();}
function lastTx(tid){var c=chronRaw(tid);return c[c.length-1];}
/* positive = they owe you; same result as summing effect() for every friend, in one pass */
function balances(tid){return cached('b'+tid,function(){
  var b={};S.friends.forEach(function(f){b[f.id]=0;});
  txIn(tid).forEach(function(t){
    if(t.type==='payment'){if(t.friend in b)b[t.friend]+=t.dir==='in'?-t.amount:t.amount;return;}
    var sh=shares(t),st=t.settled||{};
    for(var id in sh)if(id in b&&!st[id])b[id]+=sh[id];
    if(t.payer in b&&!st[t.payer])b[t.payer]-=t.amount;});
  return b;});}
function totals(tid){return cached('T'+tid,function(){var b=balances(tid),o=0,w=0;for(var k in b){if(b[k]>0)o+=b[k];else w-=b[k];}return{owed:o,owe:w,b:b};});}
function scoreMap(tid){return cached('s'+tid,function(){var sc={},now=Date.now();S.friends.forEach(function(f){sc[f.id]=0;});
  var wd={};
  txIn(tid).forEach(function(t){var w=wd[t.date];if(w==null)w=wd[t.date]=Math.pow(0.5,Math.max(0,(now-new Date(t.date+'T12:00').getTime())/864e5)/30);
    if(t.type==='payment'){if(t.friend in sc)sc[t.friend]+=w;return;}
    for(var id in t.split.parts)if(id in sc)sc[id]+=w;
    if(t.payer in sc&&!(t.payer in t.split.parts))sc[t.payer]+=w;});return sc;});}
/* recent friends in this tracker first, then recent overall, then A–Z */
function byRecent(tid){return cached('r'+tid,function(){var a=tid?scoreMap(tid):null,g=scoreMap(null);
  return S.friends.slice().sort(function(x,y){return(a?(a[y.id]-a[x.id]):0)||(g[y.id]-g[x.id])||x.name.localeCompare(y.name);});});}

/* ---------- routing ---------- */
var root=document.getElementById('root'),view='home',P={},draft=null,payForm=null,modal=null,showArchived=false,showAll=false;
/* long lists show the newest 100 rows first; the rest on request */
var LIM=100;
function capped(rows,fn){var h='<div class="list">'+(showAll?rows:rows.slice(0,LIM)).map(fn).join('')+'</div>';
  if(rows.length>LIM&&!showAll)h+='<div class="btns"><button class="btn sm full" data-act="showall">Show all '+rows.length+'</button></div>';return h;}
function parseHash(){var h=(location.hash||'').slice(1),m;P={};
  if((m=/^t-([a-z0-9]+)$/.exec(h))&&tracker(m[1])){view='tracker';P.t=m[1];P.tab='owed';}
  else if((m=/^ta-([a-z0-9]+)$/.exec(h))&&tracker(m[1])){view='tracker';P.t=m[1];P.tab='activity';}

  case 'xlsx':exportTracker(id);break;
  case 'opent':var t=txById(id);if(!t)break;
    if(t.type==='expense'){draft=fromTxn(t);go('edit-'+id);}
    else ask('Payment of '+fmt(t.amount),esc(t.dir==='in'?nameOf(t.friend)+' paid you':'You paid '+nameOf(t.friend))+' on '+dfmt(t.date)+(tracker(t.tracker)?' · '+esc(tracker(t.tracker).name):'')+'.','Delete payment',function(){S.txns=S.txns.filter(function(x){return x.id!==id;});commit();},true);
    break;
  case 'cat':draft.cat=draft.cat===el.dataset.c?'':el.dataset.c;saveDraft();var cc=document.getElementById('catchips');if(cc)cc.innerHTML=catChips();break;
  case 'mmonth':meMonth=el.dataset.m;render();break;
  case 'mexport':exportMine();break;
  case 'payer':draft.payer=id;saveDraft();rp();updateSplitInfo();break;
  case 'psettle':draft.settled=draft.settled||{};if(draft.settled[id])delete draft.settled[id];else draft.settled[id]=today();saveDraft();paybox();break;
  case 'psettleall':var dl=debtors(draftTxn()),allp=dl.every(function(d){return d.paid;});draft.settled={};if(!allp)dl.forEach(function(d){draft.settled[d.id]=today();});saveDraft();paybox();break;
  case 'sel':var i=draft.sel.indexOf(id);if(i>=0)draft.sel.splice(i,1);else draft.sel.push(id);saveDraft();rp();rs();break;
  case 'newf':f=addFriend(draft.q);if(f){commit();if(draft.sel.indexOf(f.id)<0)draft.sel.push(f.id);draft.q='';var qi=root.querySelector('[data-f="q"]');if(qi)qi.value='';saveDraft();rp();rs();}break;
  case 'more':draft.more=!draft.more;saveDraft();rp();break;
  case 'moreP':draft.moreP=!draft.moreP;saveDraft();rp();break;
  case 'addfp':case 'addfs':var asPayer=a==='addfp';
    modal={title:asPayer?'Who paid?':'Add friends to this expense',body:'<input id="m-in" placeholder="'+(asPayer?'Name':'Name — or several, separated by commas')+'" maxlength="300"><div class="note">'+(asPayer?'They’ll be added to your friends and set as the payer.':'They’ll be added to your friends and to this split.')+'</div>',ok:'Add',fn:function(){
      var v=((document.getElementById('m-in')||{}).value||'');var names=asPayer?[v]:v.split(',');var added=[];
      names.forEach(function(n){var nf=addFriend(n);if(nf)added.push(nf);});if(!added.length)return;
      if(asPayer)draft.payer=added[0].id;else added.forEach(function(nf){if(draft.sel.indexOf(nf.id)<0)draft.sel.push(nf.id);});
      commit();saveDraft();toast(added.length===1?added[0].name+' added':added.length+' friends added');}};render();break;
  case 'mode':draft.mode=el.dataset.mode;saveDraft();rs();break;
  case 'save':saveExpense();break;
  case 'deltx':var tid=draft.tracker;ask('Delete this expense?','This can’t be undone.','Delete',function(){S.txns=S.txns.filter(function(x){return x.id!==id;});clearDraft();commit();go('ta-'+tid);},true);break;
  case 'addf':var inp=document.getElementById('nf');if(inp&&inp.value.trim()){f=addFriend(inp.value);commit();toast(f.name+' added');render();}break;
  case 'settle':f=friend(P.f);tr=tracker(P.t);b=balances(tr.id)[f.id];if(!b)break;
    ask(b>0?'Mark as paid?':'Record that you paid?',esc(b>0?f.name+' paid you '+fmt(b):'You paid '+f.name+' '+fmt(b))+' for '+esc(tr.name)+'. Their balance here goes to zero.','Confirm',function(){payment(f.id,tr.id,b>0?'in':'out',Math.abs(b));commit();toast('Settled with '+f.name);});break;
  case 'settleall':f=friend(P.f);var bt=S.trackers.map(function(x){return[x,balances(x.id)[f.id]];}).filter(function(p){return p[1];});
    var net=bt.reduce(function(s,p){return s+p[1];},0);
    ask('Settle everything with '+f.name+'?',bt.map(function(p){return esc(p[0].name)+': '+(p[1]>0?'they pay ':'you pay ')+fmt(p[1]);}).join('<br>')+'<br><br>Net: '+(net>0?esc(f.name)+' pays you ':net<0?'you pay '+esc(f.name)+' ':'nothing to pay ')+(net?fmt(net):'')+'. Every tracker goes to zero.','Settle all',function(){bt.forEach(function(p){payment(f.id,p[0].id,p[1]>0?'in':'out',Math.abs(p[1]),today(),'Settled everything');});commit();toast('All settled with '+f.name);});break;
  case 'payopen':b=balances(P.t)[P.f]||0;payForm={dir:b<0?'out':'in',amount:'',date:today(),note:''};render();break;
  case 'pdir':payForm.dir=el.dataset.d;render();break;
  case 'pcancel':payForm=null;render();break;
  case 'psave':var amt=toC(payForm.amount);if(!(amt>0)){toast('Enter an amount.');break;}
    payment(P.f,P.t,payForm.dir,amt,payForm.date,payForm.note.trim());payForm=null;commit();toast('Payment saved');render();break;
  case 'copy':f=friend(P.f);copy(view==='tfriend'?reminderT(f,P.t):reminderAll(f),'Reminder copied');break;
  case 'rename':f=friend(P.f);prompt2('Rename friend',f.name,'Save',function(v){f.name=v;commit();});break;
  case 'delf':f=friend(P.f);ask('Remove '+f.name+'?','','Remove',function(){S.friends=S.friends.filter(function(x){return x.id!==f.id;});commit();go('friends');},true);break;
  case 'backup':copy(JSON.stringify(S),'Backup copied');break;
  case 'restore':var txt=(document.getElementById('restore')||{}).value||'',d;try{d=JSON.parse(txt);}catch(er){}
    if(!d||!d.v||!Array.isArray(d.friends)||!Array.isArray(d.txns)){toast('That doesn’t look like a backup.');break;}
    ask('Replace all data?','Current data will be replaced with the backup ('+d.friends.length+' friends, '+d.txns.length+' transactions)'+' on this device (send a sync afterwards to remove it from your other device too)'+'.','Restore',function(){var dead=S.dead,cu=S.cfgU;S=migrate(d);S.dead=Object.assign({},dead,S.dead);if(S.cfgU==null)S.cfgU=cu;commit();toast('Backup restored');go('home');},true);break;
  case 'erase':ask('Erase everything?','All trackers, friends and transactions will be deleted'+' on this device (send a sync afterwards to remove it from your other device too)'+'.','Erase',function(){var dead=S.dead,cu=S.cfgU;S=blank();S.dead=dead;S.cfgU=cu;clearDraft();commit();go('home');},true);break;
  case 'sendfile':sendFile();break;
  case 'sendtext':sendText();break;
  case 'mergetext':mergeReport(mergeIn((document.getElementById('synctext')||{}).value||''));break;
  case 'mclose':modal=null;render();break;
  case 'mok':var fn=modal&&modal.fn;modal=null;if(fn)fn();render();break;
  }
});
function rp(){var p=document.getElementById('pickers');if(p)p.innerHTML=pickers();}
function rs(){var s=document.getElementById('splitbox');if(s){s.innerHTML=splitbox();updateSplitInfo();}}
root.addEventListener('input',function(e){var t=e.target,f=t.dataset.f;if(!f)return;
  if(draft&&(f==='desc'||f==='date')){draft[f]=t.value;saveDraft();}
  else if(draft&&f==='amount'){draft.amount=t.value;saveDraft();updateSplitInfo();}
  else if(draft&&f==='q'){draft.q=t.value;saveDraft();rp();}
  else if(draft&&f==='val'){draft.vals[t.dataset.id]=t.value;saveDraft();updateSplitInfo();}
  else if(payForm&&f==='pamount')payForm.amount=t.value;
  else if(payForm&&f==='pdate')payForm.date=t.value;
  else if(payForm&&f==='pnote')payForm.note=t.value;
});
root.addEventListener('change',function(e){if(e.target.dataset.f==='cur'){S.currency=e.target.value.trim();commit();}
  if(e.target.id==='syncfile'&&e.target.files&&e.target.files[0]){var r=new FileReader();r.onload=function(){mergeReport(mergeIn(r.result));};r.onerror=function(){toast('Couldn’t read that file.');};r.readAsText(e.target.files[0]);}});
root.addEventListener('keydown',function(e){if(e.key!=='Enter')return;
  if(e.target.id==='nf'){e.preventDefault();var b=root.querySelector('[data-act="addf"]');if(b)b.click();}
  else if(e.target.dataset.f==='q'&&draft&&draft.q.trim()){e.preventDefault();var n=root.querySelector('[data-act="newf"]');if(n)n.click();else{var m=visible(draft.sel)[0];if(m){var c=root.querySelector('[data-act="sel"][data-id="'+m.id+'"]');if(c&&!c.classList.contains('on'))c.click();}}}
  else if(e.target.id==='m-in'){e.preventDefault();var o=root.querySelector('[data-act="mok"]');if(o)o.click();}
});

enter();render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});
window.__fm={get S(){return S;},mergeIn:mergeIn,payload:payload,unsent:unsent};
})();
</script></body></html>
